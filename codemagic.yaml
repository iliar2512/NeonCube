workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: "NeonCube App Store Connect"

    environment:
      vars:
        BUNDLE_ID: com.neoncube.cubeneocube
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
      # Автоматическая подпись через интеграцию App Store Connect API key:
      # Codemagic сам получает/создаёт Distribution-сертификат и App Store provisioning profile.
      # Загружать их вручную в Code signing identities не нужно.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: "develop"
          include: true
          source: true

    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ilia.r@digitalbit.tech
        notify:
          success: true
          failure: true
