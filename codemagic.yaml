workflows:
  ios-workflow:
    name: iOS Workflow1

    integrations:
      app_store_connect: "NeonCube App Store Connect"

    environment:
      groups:
        - ios
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: "develop"
          include: true
          source: true

    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize

      # 1. Нативно импортируем ваш рабочий сертификат подписи в keychain сборщика
      # (Этот шаг у нас отрабатывает идеально)
      - name: Extract and install Distribution certificate
        script: |
          CURRENT_KEYCHAIN=$(ls $HOME/Library/Keychains/*keychain-db | head -n 1)
          echo "Target keychain found: $CURRENT_KEYCHAIN"
          
          security unlock-keychain -p "" "$CURRENT_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$CURRENT_KEYCHAIN"
          
          echo "$ENCRYPTED_P12" | base64 -d > $HOME/dist_key.p12
          security import $HOME/dist_key.p12 -k "$CURRENT_KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$CURRENT_KEYCHAIN"
          rm $HOME/dist_key.p12

      # 2. Точечно скачиваем готовый .mobileprovision профиль напрямую с серверов Apple
      - name: Download specific Provisioning Profile from Apple
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          app-store-connect profiles list --filter "bundleId.id:com.neoncube.cubeneocube" --save --output-directory "$PROFILES_DIR"
          
          PROFILE_FILE=$(ls "$PROFILES_DIR"/*.mobileprovision | head -n 1)
          cp "$PROFILE_FILE" $HOME/embedded.mobileprovision
          echo "Provisioning profile cached successfully."

      - name: Set build number
        script: |
          agvtool new-version -all "$BUILD_NUMBER"

      # 3. ЧИСТАЯ НА ТИВНАЯ КОМПИЛЯЦИЯ КОДА: Мы собираем проект БЕЗ проверки подписей и профилей.
      # Никаких ошибок 65 на UnityFramework и GameAssembly больше не будет!
      - name: Compile Unity-iPhone Project Source
        script: |
          xcodebuild -project "Unity-iPhone.xcodeproj" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $HOME/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # 4. РУЧНАЯ УПАКОВКА И ЛЕГИТИМНАЯ ПОДПИСЬ IPA (Метод Студийной Автоматизации)
      # Мы берем скомпилированное приложение, внедряем внутрь профиль и подписываем утилитой codesign
      - name: Package and Sign Final IPA
        script: |
          # Создаем структуру релизного IPA
          mkdir -p $HOME/Payload
          cp -R $HOME/DerivedData/Build/Products/Release-iphoneos/Unity-iPhone.app $HOME/Payload/
          
          # Внедряем скачанный профиль подписи внутрь пакета игры
          cp $HOME/embedded.mobileprovision $HOME/Payload/Unity-iPhone.app/embedded.mobileprovision
          
          # Извлекаем entitlements из профиля, чтобы Apple приняла TestFlight сборку
          security cms -D -i $HOME/embedded.mobileprovision > $HOME/profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $HOME/profile.plist > $HOME/entitlements.plist
          
          # Подписываем бинарный файл приложения вашим установленным .p12 ключом Distribution
          codesign --force --sign "Apple Distribution: " --entitlements $HOME/entitlements.plist --timestamp=none $HOME/Payload/Unity-iPhone.app
          
          # Архивируем в финальный .ipa файл для отправки
          mkdir -p build/ios/ipa
          cd $HOME && zip -r build/ios/ipa/kingmap.ipa Payload
          echo "Final Signed IPA generated successfully."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ilia.r@digitalbit.tech
        notify:
          success: true
          failure: true
