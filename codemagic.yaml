workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: "NeonCube App Store Connect"

    environment:
      vars:
        BUNDLE_ID: com.neoncube.cubeneocube
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
      # Автоматическая подпись: fetch-signing-files --create через интеграцию App Store Connect
      # получает/создаёт Distribution-сертификат и App Store provisioning profile.
      # Секретная переменная CERTIFICATE_PRIVATE_KEY (RSA private key, PEM) задаётся
      # в группе переменных "signing" (Codemagic > Environment variables, Secure).
      groups:
        - signing
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: "develop"
          include: true
          source: true

    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ilia.r@digitalbit.tech
        notify:
          success: true
          failure: true
